spring:
  application:
    name: dcbo-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dcbo_placeholder}
    username: ${DB_USERNAME:placeholder}
    password: ${DB_PASSWORD:placeholder}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    web:
      pageable:
        # Caps the effective page size Spring Data honours (default with no cap is ~2000, per
        # backlog/reviews/TASK-008-r1.md IMPORTANTE 5/6): a client asking for an unreasonably
        # large page amplifies the N+1 risk of any paginated listing across every future endpoint.
        max-page-size: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://placeholder.auth0.com/}
          audiences: ${AUTH0_AUDIENCE:https://placeholder-audience/}

server:
  port: ${PORT:8080}

# URL do catalog-backend para onde este serviço propaga alterações (carros, etc.)
catalog:
  sync:
    base-url: ${CATALOG_SYNC_URL:http://localhost:8081}
    internal-token: ${CATALOG_SYNC_TOKEN:placeholder}

# Segurança (TASK-007): origens autorizadas a chamar esta API e o nome da claim de roles do Auth0
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth0:
    roles-claim: ${AUTH0_ROLES_CLAIM:https://diamondcars/roles}

management:
  endpoints:
    web:
      exposure:
        include: health,info
